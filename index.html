<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilastro B</title>
<meta name="description" content="Pilastro B compra Bitcoin dal tuo stipendio, ogni mese. Privacy by design sotto CHF 1'000. Self-custody assistita. Rendita opzionale con covered call.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16140F; --panel:#1F1C15; --panel2:#26221A; --line:#37311F; --line2:#47402B;
  --ink:#FAF6EC; --body:#CFC8B4; --muted:#978D75; --dim:#6B6450;
  --amber:#F7931A; --amber-soft:#FFB84D; --amber-dim:rgba(247,147,26,.14);
  --sage:#8FC7A0; --sage-dim:rgba(143,199,160,.12);
  --mono:'Space Mono',monospace; --serif:'Lora',serif; --sans:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--body);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(900px 500px at 80% -10%,rgba(247,147,26,.09),transparent 60%),
             radial-gradient(700px 500px at 10% 30%,rgba(143,199,160,.05),transparent 60%)}
::selection{background:var(--amber);color:#16140F}
a{color:inherit;text-decoration:none}
.wrap{width:min(1080px,calc(100% - 48px));margin-inline:auto;position:relative}

/* NAV */
nav{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(22,20,15,.9);backdrop-filter:blur(10px);z-index:50}
nav .wrap{display:flex;align-items:center;gap:26px;height:64px}
.logo{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink);letter-spacing:-.02em}
.logo b{color:var(--amber)}
.nav-links{display:flex;gap:24px;font-size:12.5px;color:var(--muted);flex:1}
.nav-links a:hover{color:var(--ink)}
.langsel{position:relative}
.langsel select{appearance:none;background:var(--panel);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:12px;font-weight:700;padding:8px 30px 8px 14px;border-radius:7px;cursor:pointer;letter-spacing:.05em}
.langsel::after{content:"▾";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--amber);font-size:11px;pointer-events:none}
.langsel select:hover,.langsel select:focus{border-color:var(--amber);outline:none}
.nav-cta{font-family:var(--mono);font-size:11.5px;font-weight:700;color:#16140F;background:linear-gradient(135deg,var(--amber),var(--amber-soft));padding:9px 16px;border-radius:7px;letter-spacing:.04em;white-space:nowrap}
.nav-cta:hover{filter:brightness(1.1)}
@media(max-width:820px){.nav-links{display:none}}

/* HERO */
.hero{padding:100px 0 80px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;margin-bottom:24px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(40px,6.6vw,72px);line-height:1.04;letter-spacing:-.03em;color:var(--ink);max-width:15ch}
h1 em{font-style:italic;color:var(--amber)}
.lede{margin-top:28px;max-width:560px;font-size:17px;line-height:1.6}
.lede strong{color:var(--ink)}
.hero-stats{display:flex;margin-top:52px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.hstat{flex:1;padding:24px 26px;border-right:1px solid var(--line)}
.hstat:last-child{border-right:none}
.hstat .n{font-family:var(--mono);font-weight:700;font-size:clamp(21px,2.8vw,30px);color:var(--ink)}
.hstat .n span{color:var(--amber)}
.hstat .n span.g{color:var(--sage)}
.hstat .l{font-size:12px;color:var(--muted);margin-top:6px}
@media(max-width:760px){.hero-stats{flex-direction:column}.hstat{border-right:none;border-bottom:1px solid var(--line)}.hstat:last-child{border-bottom:none}}
.cta-row{display:flex;gap:14px;margin-top:42px;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:13px;font-weight:700;padding:15px 26px;border-radius:8px;letter-spacing:.03em;display:inline-block;transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn-p{background:linear-gradient(135deg,var(--amber),var(--amber-soft));color:#16140F;box-shadow:0 6px 24px rgba(247,147,26,.25)}
.btn-s{border:1px solid var(--line2);color:var(--ink)}
.btn-s:hover{border-color:var(--amber);color:var(--amber)}

/* SECTIONS */
section{padding:84px 0;border-bottom:1px solid var(--line)}
.sec-tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;margin-bottom:18px}
h2{font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,42px);line-height:1.12;letter-spacing:-.02em;color:var(--ink);max-width:24ch;margin-bottom:18px}
.sec-lede{max-width:620px;font-size:15.5px}
.sec-lede strong{color:var(--ink)}

/* CHART + CALC */
.chartbox{margin-top:44px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:30px 26px 20px}
canvas{width:100%;height:auto;display:block}
.chart-legend{display:flex;gap:26px;padding:16px 4px 4px;font-size:12px;font-family:var(--mono);color:var(--muted);flex-wrap:wrap}
.chart-legend i{display:inline-block;width:22px;height:3px;border-radius:2px;vertical-align:middle;margin-right:8px}
.calc{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
@media(max-width:860px){.calc{grid-template-columns:1fr}}
.calc-in{padding:32px;border-right:1px solid var(--line)}
.calc-out{padding:32px;background:linear-gradient(180deg,rgba(247,147,26,.06),transparent);display:flex;flex-direction:column;gap:20px;justify-content:center}
@media(max-width:860px){.calc-in{border-right:none;border-bottom:1px solid var(--line)}}
.slider-block{margin-bottom:24px}
.slider-block:last-child{margin-bottom:0}
.slider-block label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.slider-block label output{font-family:var(--mono);color:var(--ink);font-weight:700}
input[type=range]{width:100%;-webkit-appearance:none;height:3px;background:var(--line2);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amber);cursor:pointer;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--amber)}
.result-row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:13px}
.result-row .rl{font-size:13px;color:var(--muted);max-width:55%}
.result-row .rv{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--sage)}
.result-row .rv.amber{color:var(--amber)}
.verdict{font-family:var(--serif);font-style:italic;font-size:16.5px;color:var(--ink);line-height:1.45}
.num-note{font-size:12px;color:var(--dim);margin-top:16px;font-family:var(--mono)}

/* STEPS */
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:44px}
@media(max-width:760px){.steps{grid-template-columns:1fr}}
.step{background:var(--panel);padding:32px}
.step .num{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.1em;margin-bottom:14px}
.step h3{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink);margin-bottom:10px}
.step p{font-size:14px}
.step p strong{color:var(--ink)}

/* PRIVACY */
.priv{margin-top:44px;border:1px solid rgba(143,199,160,.35);border-radius:12px;background:linear-gradient(135deg,var(--sage-dim),transparent 60%);padding:38px}
.priv h3{font-family:var(--serif);font-size:22px;color:var(--ink);margin-bottom:14px;max-width:26ch}
.priv p{max-width:640px;font-size:15px}
.priv p strong{color:var(--sage)}
.priv .badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.priv .badge{font-family:var(--mono);font-size:11px;color:var(--sage);border:1px solid rgba(143,199,160,.4);padding:6px 12px;border-radius:99px}

/* CUSTODY */
.split{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:44px}
@media(max-width:760px){.split{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:32px}
.card h3{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:12px}
.card ul{list-style:none;margin-top:12px}
.card li{font-size:14px;padding:9px 0 9px 22px;position:relative;border-bottom:1px solid var(--line)}
.card li:last-child{border-bottom:none}
.card li::before{content:"—";position:absolute;left:0;color:var(--amber)}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);background:var(--amber-dim);border:1px solid rgba(247,147,26,.35);padding:4px 10px;border-radius:99px;margin-bottom:14px}


/* PRICE TICKER */
.tick{font-family:var(--mono);font-size:12px;color:var(--sage);white-space:nowrap}
.tick b{color:var(--ink)}
@media(max-width:820px){.tick{display:none}}
/* SIMULATOR */
.sim{margin-top:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.sim-head{padding:28px 32px;border-bottom:1px solid var(--line);display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.sim-head .sh-l{flex:1;min-width:240px}
.sim-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.sim-cell{padding:24px 26px;border-right:1px solid var(--line)}
.sim-cell:last-child{border-right:none}
.sim-cell .n{font-family:var(--mono);font-weight:700;font-size:clamp(17px,2vw,23px);color:var(--ink)}
.sim-cell .n.up{color:var(--sage)} .sim-cell .n.dn{color:#D98F6A}
.sim-cell .l{font-size:11.5px;color:var(--muted);margin-top:6px}
@media(max-width:760px){.sim-grid{grid-template-columns:1fr 1fr}.sim-cell{border-bottom:1px solid var(--line)}}
.sim-src{font-size:11px;color:var(--dim);font-family:var(--mono);padding:12px 32px;border-top:1px solid var(--line)}
/* WHY CARDS */
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px}
@media(max-width:760px){.why{grid-template-columns:1fr}}
.why .card h3{font-size:17px}
/* FAQ */
.faq{margin-top:44px;border-top:1px solid var(--line)}
.faq-item{border-bottom:1px solid var(--line)}
.faq-q{width:100%;background:none;border:none;color:var(--ink);font-family:var(--serif);font-size:17px;font-weight:600;text-align:left;padding:22px 34px 22px 0;cursor:pointer;position:relative}
.faq-q::after{content:"+";position:absolute;right:4px;top:50%;transform:translateY(-50%);font-family:var(--mono);color:var(--amber);font-size:20px}
.faq-item.open .faq-q::after{content:"–"}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;color:var(--body);font-size:14px}
.faq-a p{padding:0 0 22px;max-width:680px}

/* CTA */
.final{padding:100px 0;text-align:center}
.final h2{margin-inline:auto}
.final .sec-lede{margin-inline:auto}
.waitlist{margin:38px auto 0;display:flex;max-width:460px;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--panel)}
.waitlist input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-family:var(--mono);font-size:13px;padding:16px 18px;min-width:0}
.waitlist input::placeholder{color:var(--dim)}
.waitlist button{background:linear-gradient(135deg,var(--amber),var(--amber-soft));color:#16140F;border:none;font-family:var(--mono);font-weight:700;font-size:13px;padding:0 22px;cursor:pointer;white-space:nowrap}
.wl-done{display:none;font-family:var(--mono);font-size:13px;color:var(--sage);margin-top:16px}
.wl-note{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:16px}

footer{padding:40px 0 60px;font-size:12px;color:var(--dim)}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer .disc{max-width:640px;line-height:1.7}

.fade{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.fade.on{opacity:1;transform:none}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="logo" href="#">Pilastro<b>B</b></a>
    <span class="tick" id="tick"></span>
    <div class="nav-links">
      <a href="#curva" data-i18n="nav.curve"></a>
      <a href="#come" data-i18n="nav.how"></a>
      <a href="#privacy" data-i18n="nav.privacy"></a>
      <a href="#custodia" data-i18n="nav.custody"></a>
    </div>
    <div class="langsel">
      <select id="lang" aria-label="Language">
        <option value="it">IT</option>
        <option value="de">DE</option>
        <option value="fr">FR</option>
        <option value="en">EN</option>
      </select>
    </div>
    <a class="nav-cta" href="#iscriviti" data-i18n="nav.cta"></a>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow fade" data-i18n="hero.eyebrow"></p>
    <h1 class="fade" data-i18n-html="hero.h1"></h1>
    <p class="lede fade" data-i18n-html="hero.lede"></p>
    <div class="cta-row fade">
      <a class="btn btn-p" href="#iscriviti" data-i18n="hero.cta1"></a>
      <a class="btn btn-s" href="#curva" data-i18n="hero.cta2"></a>
    </div>
    <div class="hero-stats fade">
      <div class="hstat"><div class="n"><span>~8%</span><span data-i18n="hero.s1u"></span></div><div class="l" data-i18n="hero.s1"></div></div>
      <div class="hstat"><div class="n">CHF <span class="g">1'000</span></div><div class="l" data-i18n="hero.s2"></div></div>
      <div class="hstat"><div class="n"><span>0%</span></div><div class="l" data-i18n="hero.s3"></div></div>
    </div>
  </div>
</header>

<section id="curva">
  <div class="wrap">
    <p class="sec-tag fade" data-i18n="curve.tag"></p>
    <h2 class="fade" data-i18n="curve.h2"></h2>
    <p class="sec-lede fade" data-i18n-html="curve.lede"></p>
    <div class="chartbox fade">
      <canvas id="chart" height="380"></canvas>
      <div class="chart-legend">
        <span><i style="background:var(--sage)"></i><span data-i18n="curve.leg3a"></span></span>
        <span><i style="background:var(--amber)"></i><span data-i18n="curve.legbtc"></span></span>
      </div>
    </div>
    <div class="calc fade">
      <div class="calc-in">
        <div class="slider-block">
          <label><span data-i18n="calc.amt"></span><output id="oAmt"></output></label>
          <input type="range" id="rAmt" min="100" max="1000" step="50" value="600">
        </div>
        <div class="slider-block">
          <label><span data-i18n="calc.btc"></span><output id="oBtc"></output></label>
          <input type="range" id="rBtc" min="0" max="40" step="1" value="15">
        </div>
        <div class="slider-block">
          <label><span data-i18n="calc.yrs"></span><output id="oYrs"></output></label>
          <input type="range" id="rYrs" min="5" max="25" step="1" value="15">
        </div>
        <div class="slider-block">
          <label><span data-i18n="calc.tax"></span><output id="oTax"></output></label>
          <input type="range" id="rTax" min="20" max="42" step="1" value="30">
        </div>
      </div>
      <div class="calc-out">
        <div class="result-row"><span class="rl" data-i18n="calc.res3a"></span><span class="rv" id="res3a">—</span></div>
        <div class="result-row" style="border-bottom:none"><span class="rl" data-i18n="calc.resB"></span><span class="rv amber" id="resBtc">—</span></div>
        <p class="verdict" id="resVerdict"></p>
      </div>
    </div>
    <p class="num-note fade" data-i18n="curve.note"></p>
  </div>
</section>


<section id="storico">
  <div class="wrap">
    <p class="sec-tag fade" data-i18n="sim.tag"></p>
    <h2 class="fade" data-i18n="sim.h2"></h2>
    <p class="sec-lede fade" data-i18n-html="sim.lede"></p>
    <div class="sim fade">
      <div class="sim-head">
        <div class="sh-l slider-block" style="margin-bottom:0">
          <label><span data-i18n="sim.amt"></span><output id="oSimAmt"></output></label>
          <input type="range" id="rSimAmt" min="50" max="1000" step="50" value="200">
        </div>
        <div class="sh-l slider-block" style="margin-bottom:0">
          <label><span data-i18n="sim.start"></span><output></output></label>
          <input type="range" id="rSimStart" min="1" max="8" step="1" value="4">
        </div>
      </div>
      <div class="sim-grid">
        <div class="sim-cell"><div class="n" id="simSats">—</div><div class="l" data-i18n="sim.sats"></div></div>
        <div class="sim-cell"><div class="n" id="simVal">—</div><div class="l" data-i18n="sim.val"></div></div>
        <div class="sim-cell"><div class="n" id="simInv">—</div><div class="l" data-i18n="sim.inv"></div></div>
        <div class="sim-cell"><div class="n" id="simPL">—</div><div class="l" data-i18n="sim.pl"></div></div>
      </div>
      <p class="sim-src" id="simSrc"></p>
    </div>
    <div class="why fade">
      <div class="card"><h3 data-i18n="why.c1t"></h3><p data-i18n="why.c1p"></p></div>
      <div class="card"><h3 data-i18n="why.c2t"></h3><p data-i18n="why.c2p"></p></div>
      <div class="card"><h3 data-i18n="why.c3t"></h3><p data-i18n="why.c3p"></p></div>
    </div>
  </div>
</section>

<section id="faq">
  <div class="wrap">
    <p class="sec-tag fade" data-i18n="faq.tag"></p>
    <h2 class="fade" data-i18n="faq.h2"></h2>
    <div class="faq fade" id="faqList"></div>
  </div>
</section>

<section id="come">
  <div class="wrap">
    <p class="sec-tag fade" data-i18n="how.tag"></p>
    <h2 class="fade" data-i18n="how.h2"></h2>
    <div class="steps fade">
      <div class="step"><p class="num" data-i18n="how.s1n"></p><h3 data-i18n="how.s1t"></h3><p data-i18n-html="how.s1p"></p></div>
      <div class="step"><p class="num" data-i18n="how.s2n"></p><h3 data-i18n="how.s2t"></h3><p data-i18n-html="how.s2p"></p></div>
      <div class="step"><p class="num" data-i18n="how.s3n"></p><h3 data-i18n="how.s3t"></h3><p data-i18n-html="how.s3p"></p></div>
      <div class="step"><p class="num" data-i18n="how.s4n"></p><h3 data-i18n="how.s4t"></h3><p data-i18n-html="how.s4p"></p></div>
    </div>
  </div>
</section>

<section id="privacy">
  <div class="wrap">
    <p class="sec-tag fade" data-i18n="priv.tag"></p>
    <div class="priv fade">
      <h3 data-i18n="priv.h3"></h3>
      <p data-i18n-html="priv.p"></p>
      <div class="badges">
        <span class="badge" data-i18n="priv.b1"></span>
        <span class="badge" data-i18n="priv.b2"></span>
        <span class="badge" data-i18n="priv.b3"></span>
      </div>
    </div>
  </div>
</section>

<section id="custodia">
  <div class="wrap">
    <p class="sec-tag fade" data-i18n="cust.tag"></p>
    <h2 class="fade" data-i18n="cust.h2"></h2>
    <div class="split fade">
      <div class="card">
        <span class="tag" data-i18n="cust.c1tag"></span>
        <h3 data-i18n="cust.c1t"></h3>
        <ul><li data-i18n="cust.c1l1"></li><li data-i18n="cust.c1l2"></li><li data-i18n="cust.c1l3"></li><li data-i18n="cust.c1l4"></li></ul>
      </div>
      <div class="card">
        <span class="tag" data-i18n="cust.c2tag"></span>
        <h3 data-i18n="cust.c2t"></h3>
        <ul><li data-i18n="cust.c2l1"></li><li data-i18n="cust.c2l2"></li><li data-i18n="cust.c2l3"></li><li data-i18n="cust.c2l4"></li></ul>
      </div>
    </div>
  </div>
</section>

<section class="final" id="iscriviti" style="border-bottom:none">
  <div class="wrap">
    <p class="sec-tag fade" data-i18n="fin.tag"></p>

let LANG='it';
const LOCALES={it:'it-CH',de:'de-CH',fr:'fr-CH',en:'en-CH'};
function t(k){return I18N[LANG][k]??I18N.it[k]??k;}
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  calc();
  renderFaq();
}
function detectLang(){
  const nav=(navigator.language||'it').slice(0,2).toLowerCase();
  return I18N[nav]?nav:'en';
}
const langSel=document.getElementById('lang');
langSel.addEventListener('change',e=>{LANG=e.target.value;applyLang();});
langSel.value=detectLang(); LANG=langSel.value;

// fade-in
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on')}),{threshold:.1});
document.querySelectorAll('.fade').forEach(el=>io.observe(el));

// finance math
const r3a=0.06, exit3a=0.065, cap3a=604.8, DD=-0.5, DD_YEARS=3;
const fmt=n=>{const loc=LOCALES[LANG];return 'CHF '+Math.round(n).toLocaleString(loc);};
function fvSeries(pmt,annual,years,drawdown){
  const i=annual/12; let v=0; const pts=[0];
  for(let m=1;m<=years*12;m++){
    v=v*(1+i)+pmt;
    if(drawdown && m<=DD_YEARS*12){
      // amortize a -50% hit evenly across first DD_YEARS
      v=v*(1+DD/(DD_YEARS*12));
    }
    if(m%12===0)pts.push(v);
  }
  return pts;
}
const fv=(pmt,annual,years)=>fvSeries(pmt,annual,years,false)[years];

function calc(){
  const amt=+document.getElementById('rAmt').value, btc=+document.getElementById('rBtc').value/100, yrs=+document.getElementById('rYrs').value, tax=+document.getElementById('rTax').value/100;
  const gross=amt/(1-tax);
  const pmt3=Math.min(gross,cap3a);
  const v3=fv(pmt3,r3a,yrs)*(1-exit3a);
  const spill=Math.max(0,amt-cap3a*(1-tax));
  const v3total=v3+fv(spill,btc,yrs);
  const vB=fv(amt,btc,yrs);
  const loc=LOCALES[LANG];
  document.getElementById('oAmt').textContent='CHF '+amt.toLocaleString(loc);
  document.getElementById('oBtc').textContent=document.getElementById('rBtc').value+'%';
  document.getElementById('oYrs').textContent=yrs+(LANG==='de'?' Jahre':LANG==='fr'?' ans':LANG==='en'?' years':' anni');
  document.getElementById('oTax').textContent=document.getElementById('rTax').value+'%';
  document.getElementById('res3a').textContent=fmt(v3total);
  document.getElementById('resBtc').textContent=fmt(vB);
  const diff=vB-v3total;
  const V={it:[d=>`Pilastro B vince di ${fmt(d)}. Il 3a ti costa quella cifra.`,()=>'A questi rendimenti il 3a regge. Il tuo toro non è abbastanza toro.'],
    de:[d=>`Pilastro B gewinnt mit ${fmt(d)}. Die 3a kostet dich diesen Betrag.`,()=>'Bei diesen Renditen hält die 3a. Dein Bulle ist nicht bullish genug.'],
    fr:[d=>`Pilastro B gagne de ${fmt(d)}. Le 3e pilier vous coûte cette somme.`,()=>'À ces rendements, le 3e pilier tient. Votre taureau n\'est pas assez taureau.'],
    en:[d=>`Pilastro B wins by ${fmt(d)}. Pillar 3a costs you that much.`,()=>'At these returns, 3a holds. Your bull is not bullish enough.']}[LANG];
  document.getElementById('resVerdict').textContent=diff>0?V[0](diff):V[1]();
  drawChart(amt,btc,yrs,tax,pmt3,spill);
}

// chart
const cv=document.getElementById('chart'),ctx=cv.getContext('2d');
function drawChart(amt,btc,yrs,tax,pmt3,spill){
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=380;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const sB=fvSeries(amt,btc,yrs,false);
  const sBdd=fvSeries(amt,btc,yrs,true);
  const s3=fvSeries(pmt3,r3a,yrs,false).map((v,y)=>v*(1-exit3a)+fv(spill,btc,y));
  const max=Math.max(sB[yrs],s3[yrs])*1.08;
  const padL=64,padR=14,padT=20,padB=34;
  const X=y=>padL+(W-padL-padR)*(y/yrs);
  const Y=v=>H-padB-(H-padT-padB)*(v/max);
  const mono="11px 'Space Mono'";
  // grid
  ctx.font=mono; ctx.fillStyle='#6B6450'; ctx.strokeStyle='#2B2718'; ctx.lineWidth=1;
  const steps=4;
  for(let g=0;g<=steps;g++){
    const v=max/steps*g, y=Y(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.textAlign='right';
    ctx.fillText(g===0?'0':(v/1000).toFixed(0)+'k',padL-8,y+4);
  }
  ctx.textAlign='center';
  const tickEvery=yrs>15?5:yrs>8?2:1;
  for(let y=0;y<=yrs;y+=tickEvery)ctx.fillText('Y'+y,X(y),H-12);
  // drawdown band (dashed, dim)
  ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(247,147,26,.35)'; ctx.lineWidth=1.5;
  ctx.beginPath(); sBdd.forEach((v,y)=>y?ctx.lineTo(X(y),Y(v)):ctx.moveTo(X(0),Y(v))); ctx.stroke();
  ctx.setLineDash([]);
  // 3a
  ctx.strokeStyle='#8FC7A0'; ctx.lineWidth=2.5;
  ctx.beginPath(); s3.forEach((v,y)=>y?ctx.lineTo(X(y),Y(v)):ctx.moveTo(X(0),Y(v))); ctx.stroke();
  // BTC + gradient fill
  const grad=ctx.createLinearGradient(0,padT,0,H-padB);
  grad.addColorStop(0,'rgba(247,147,26,.25)'); grad.addColorStop(1,'rgba(247,147,26,0)');
  ctx.beginPath(); sB.forEach((v,y)=>y?ctx.lineTo(X(y),Y(v)):ctx.moveTo(X(0),Y(v)));
  ctx.lineTo(X(yrs),Y(0)); ctx.lineTo(X(0),Y(0)); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath(); sB.forEach((v,y)=>y?ctx.lineTo(X(y),Y(v)):ctx.moveTo(X(0),Y(v)));
  ctx.strokeStyle='#F7931A'; ctx.lineWidth=3; ctx.stroke();
  // end labels
  ctx.font="bold 12px 'Space Mono'"; ctx.textAlign='right';
  ctx.fillStyle='#F7931A'; ctx.fillText(fmt(sB[yrs]),W-padR,Y(sB[yrs])-10);
  ctx.fillStyle='#8FC7A0'; ctx.fillText(fmt(s3[yrs]),W-padR,Y(s3[yrs])+18);
}

// historical DCA simulator (CoinGecko daily prices)
let priceCache={};
async function getPrices(days){
  if(priceCache[days])return priceCache[days];
  let prices=null;
  try{
    const r=await fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=chf&days='+days+'&interval=daily');
    if(r.ok){ const j=await r.json(); if(j.prices&&j.prices.length)prices=j.prices; }
  }catch(e){}
  if(!prices){
    // fallback: Kraken XBTCHF daily OHLC (no key)
    prices=[]; let since=Math.floor(Date.now()/1000)-days*86400;
    for(let k=0;k<5;k++){
      const r=await fetch('https://api.kraken.com/0/public/OHLC?pair=XBTCHF&interval=1440&since='+since);
      const j=await r.json();
      const arr=j.result&&j.result.XBTCHF; if(!arr||!arr.length)break;
      for(const c of arr)prices.push([c[0]*1000,parseFloat(c[4])]);
      since=arr[arr.length-1][0]+86400;
      if(arr.length<700)break;
    }
    if(!prices.length)throw new Error('no prices');
  }
  priceCache[days]=prices; return prices;
}
async function sim(){
  const amt=+document.getElementById('rSimAmt').value;
  const yrs=+document.getElementById('rSimStart').value;
  const loc=LOCALES[LANG];
  document.getElementById('oSimAmt').textContent='CHF '+amt.toLocaleString(loc);
  const src=document.getElementById('simSrc');
  src.textContent='// CoinGecko ...';
  try{
    const prices=await getPrices(yrs*365+30);
    const cutoff=Date.now()-yrs*365*86400000;
    const p=prices.filter(pt=>pt[0]>=cutoff);
    if(p.length<30)throw 0;
    const monthMs=30.44*86400000;
    let sats=0, inv=0, next=p[0][0];
    for(const pt of p){ const ts=pt[0], price=pt[1];
      if(ts>=next){ sats+=amt/price; inv+=amt; next=ts+monthMs; }
    }
    const last=p[p.length-1][1];
    const val=sats*last, pl=val-inv;
    document.getElementById('simSats').textContent=sats.toFixed(4)+' BTC';
    document.getElementById('simVal').textContent='CHF '+Math.round(val).toLocaleString(loc);
    document.getElementById('simInv').textContent='CHF '+Math.round(inv).toLocaleString(loc);
    const el=document.getElementById('simPL');
    el.textContent=(pl>=0?'+':'-')+' CHF '+Math.abs(Math.round(pl)).toLocaleString(loc);
    el.className='n '+(pl>=0?'up':'dn');
    src.textContent='// '+({it:'Prezzi giornalieri CoinGecko. Simulazione a scopo informativo, non consulenza né garanzia di rendimento.',de:'Taegliche CoinGecko-Kurse. Nur zu Informationszwecken, keine Beratung, keine Renditegarantie.',fr:'Prix quotidiens CoinGecko. Simulation informative, ni conseil ni garantie de rendement.',en:'Daily CoinGecko prices. Simulation for information only, not advice or a performance guarantee.'})[LANG];
  }catch(e){
    src.textContent='// CoinGecko offline';
  }
}
